<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дурак с ИИ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #fff);
            padding: 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            background: var(--tg-theme-secondary-bg-color, #2a2a2a);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .trump-display {
            font-size: 36px;
            text-align: center;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }
        .table-area {
            background: linear-gradient(135deg, #1e4620 0%, #2d5016 100%);
            border-radius: 15px;
            padding: 20px;
            min-height: 180px;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
        }
        .table-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }
        .card-pair {
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 8px;
        }
        .arrow {
            color: #ffd700;
            font-size: 20px;
        }
        .card {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
            min-width: 55px;
            text-align: center;
        }
        .card:hover:not(.disabled):not(.table-card) {
            transform: translateY(-8px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.4);
        }
        .card:active:not(.disabled) {
            transform: translateY(-4px);
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }
        .card.red {
            color: #d32f2f;
        }
        .card.black {
            color: #1a1a1a;
        }
        .card.empty {
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.2);
        }
        .status-bar {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #2a2a2a);
        }
        .status-bar.attack {
            background: #d32f2f;
        }
        .status-bar.defend {
            background: #1976d2;
        }
        .status-bar.gameover {
            background: #ffd700;
            color: #000;
        }
        .hand-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            padding: 15px;
            background: var(--tg-theme-secondary-bg-color, #2a2a2a);
            border-radius: 12px;
        }
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .btn {
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn.danger {
            background: #d32f2f;
        }
        .btn.success {
            background: #388e3c;
        }
        .ai-thinking {
            text-align: center;
            padding: 10px;
            color: #ffd700;
            font-style: italic;
        }
        .empty-table {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-style: italic;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <div class="trump-display" id="trump">🃏</div>
                <div style="text-align: center; font-size: 12px; opacity: 0.7;">Козырь</div>
            </div>
            <div class="stats">
                <div>
                    <div style="font-size: 20px;" id="deckCount">36</div>
                    <div style="opacity: 0.7; font-size: 12px;">Колода</div>
                </div>
                <div>
                    <div style="font-size: 20px;" id="aiCount">6</div>
                    <div style="opacity: 0.7; font-size: 12px;">У ИИ</div>
                </div>
            </div>
        </div>

        <div class="status-bar" id="status">Загрузка...</div>

        <div class="table-area">
            <div class="table-cards" id="tableCards">
                <div class="empty-table">Стол пуст</div>
            </div>
        </div>

        <div class="ai-thinking" id="aiThinking" style="display: none;">
            🤖 ИИ думает...
        </div>

        <div class="actions" id="actions"></div>

        <div class="hand-area" id="playerHand"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // ========== ИГРА В ДУРАКА ==========
        class Card {
            static SUITS = ['♠', '♥', '♦', '♣'];
            static RANKS = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];

            constructor(suit, rank) {
                this.suit = suit;
                this.rank = rank;
                this.value = Card.RANKS.indexOf(rank);
            }

            toString() {
                return `${this.rank}${this.suit}`;
            }

            beats(other, trumpSuit) {
                if (this.suit === other.suit) {
                    return this.value > other.value;
                }
                return this.suit === trumpSuit;
            }

            isRed() {
                return this.suit === '♥' || this.suit === '♦';
            }
        }

        class DurakGame {
            constructor() {
                this.deck = [];
                for (let suit of Card.SUITS) {
                    for (let rank of Card.RANKS) {
                        this.deck.push(new Card(suit, rank));
                    }
                }
                this.shuffle(this.deck);

                this.trump = this.deck[this.deck.length - 1];
                this.playerHand = [];
                this.aiHand = [];
                this.table = [];
                this.attackerIsPlayer = true;
                this.gameOver = false;
                this.winner = null;

                for (let i = 0; i < 6; i++) {
                    this.playerHand.push(this.deck.pop());
                    this.aiHand.push(this.deck.pop());
                }
            }

            shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            getValidMoves(isPlayer) {
                const hand = isPlayer ? this.playerHand : this.aiHand;

                if (this.table.length === 0) {
                    return hand.map((_, i) => i);
                }

                if (isPlayer === this.attackerIsPlayer) {
                    // Атака
                    const tableRanks = new Set();
                    this.table.forEach(pair => {
                        if (pair.attack) tableRanks.add(pair.attack.rank);
                        if (pair.defense) tableRanks.add(pair.defense.rank);
                    });
                    return hand.map((c, i) => tableRanks.has(c.rank) ? i : -1).filter(i => i >= 0);
                } else {
                    // Защита
                    const undefended = this.table.find(p => !p.defense);
                    if (!undefended) return [];
                    return hand.map((c, i) => c.beats(undefended.attack, this.trump.suit) ? i : -1).filter(i => i >= 0);
                }
            }

            playCard(cardIndex, isPlayer) {
                const hand = isPlayer ? this.playerHand : this.aiHand;
                const card = hand.splice(cardIndex, 1)[0];

                if (isPlayer === this.attackerIsPlayer) {
                    this.table.push({ attack: card, defense: null });
                } else {
                    const pair = this.table.find(p => !p.defense);
                    if (pair) pair.defense = card;
                }
            }

            canFinish() {
                return this.table.length > 0 && this.table.every(p => p.defense);
            }

            endTurn(defenderTakes = false) {
                if (defenderTakes) {
                    const cards = [];
                    this.table.forEach(p => {
                        cards.push(p.attack);
                        if (p.defense) cards.push(p.defense);
                    });
                    if (this.attackerIsPlayer) {
                        this.aiHand.push(...cards);
                    } else {
                        this.playerHand.push(...cards);
                    }
                } else {
                    this.attackerIsPlayer = !this.attackerIsPlayer;
                }

                this.table = [];
                this.refillHands();
                this.checkGameOver();
            }

            refillHands() {
                const attacker = this.attackerIsPlayer ? this.playerHand : this.aiHand;
                const defender = this.attackerIsPlayer ? this.aiHand : this.playerHand;

                while (attacker.length < 6 && this.deck.length > 0) {
                    attacker.push(this.deck.pop());
                }
                while (defender.length < 6 && this.deck.length > 0) {
                    defender.push(this.deck.pop());
                }
            }

            checkGameOver() {
                if (this.deck.length === 0) {
                    if (this.playerHand.length === 0) {
                        this.gameOver = true;
                        this.winner = 'player';
                    } else if (this.aiHand.length === 0) {
                        this.gameOver = true;
                        this.winner = 'ai';
                    }
                }
            }

            // Простой ИИ с эвристиками
            aiMove() {
                const moves = this.getValidMoves(false);
                if (moves.length === 0) return null;

                if (this.attackerIsPlayer) {
                    // Защита: бить самой слабой картой
                    const undefended = this.table.find(p => !p.defense);
                    let bestMove = moves[0];
                    let minValue = this.aiHand[bestMove].value;
                    
                    for (let i of moves) {
                        const card = this.aiHand[i];
                        const isTrump = card.suit === this.trump.suit;
                        const attackIsTrump = undefended.attack.suit === this.trump.suit;
                        
                        if (!isTrump && attackIsTrump) continue; // Не бить козырем не козырь
                        if (card.value < minValue) {
                            minValue = card.value;
                            bestMove = i;
                        }
                    }
                    return bestMove;
                } else {
                    // Атака: ходить самой старшей картой
                    let bestMove = moves[0];
                    let maxValue = this.aiHand[bestMove].value;
                    
                    for (let i of moves) {
                        if (this.aiHand[i].value > maxValue) {
                            maxValue = this.aiHand[i].value;
                            bestMove = i;
                        }
                    }
                    return bestMove;
                }
            }
        }

        // ========== UI ==========
        let game = null;
        let isProcessing = false;

        function startGame() {
            game = new DurakGame();
            isProcessing = false;
            render();
        }

        function render() {
            // Козырь и статистика
            document.getElementById('trump').textContent = game.trump.toString();
            document.getElementById('deckCount').textContent = game.deck.length;
            document.getElementById('aiCount').textContent = game.aiHand.length;

            // Статус
            const statusEl = document.getElementById('status');
            if (game.gameOver) {
                statusEl.className = 'status-bar gameover';
                statusEl.textContent = game.winner === 'player' ? '🎉 Вы победили!' : '😢 ИИ победил';
            } else if (game.attackerIsPlayer) {
                statusEl.className = 'status-bar attack';
                statusEl.textContent = '🔴 Ваш ход - Атака';
            } else {
                statusEl.className = 'status-bar defend';
                statusEl.textContent = '🔵 Ваш ход - Защита';
            }

            // Стол
            const tableEl = document.getElementById('tableCards');
            if (game.table.length === 0) {
                tableEl.innerHTML = '<div class="empty-table">Стол пуст</div>';
            } else {
                tableEl.innerHTML = game.table.map(pair => `
                    <div class="card-pair">
                        <div class="card table-card ${pair.attack.isRed() ? 'red' : 'black'}">
                            ${pair.attack.toString()}
                        </div>
                        <span class="arrow">←</span>
                        <div class="card table-card ${pair.defense ? (pair.defense.isRed() ? 'red' : 'black') : 'empty'}">
                            ${pair.defense ? pair.defense.toString() : '?'}
                        </div>
                    </div>
                `).join('');
            }

            // Кнопки действий
            const actionsEl = document.getElementById('actions');
            if (game.gameOver) {
                actionsEl.innerHTML = '<button class="btn" onclick="startGame()">🔄 Новая игра</button>';
            } else {
                let html = '';
                if (!game.attackerIsPlayer && game.table.length > 0) {
                    html += '<button class="btn danger" onclick="takeCards()">🛑 Беру</button>';
                }
                if (game.attackerIsPlayer && game.canFinish()) {
                    html += '<button class="btn success" onclick="finishAttack()">✅ Бито</button>';
                }
                actionsEl.innerHTML = html;
            }

            // Карты игрока
            const validMoves = game.getValidMoves(true);
            const handEl = document.getElementById('playerHand');
            handEl.innerHTML = game.playerHand.map((card, i) => {
                const isValid = validMoves.includes(i);
                return `
                    <div class="card ${card.isRed() ? 'red' : 'black'} ${isValid ? '' : 'disabled'}" 
                         onclick="${isValid && !isProcessing ? `playCard(${i})` : ''}">
                        ${card.toString()}
                    </div>
                `;
            }).join('');
        }

        async function playCard(index) {
            if (isProcessing || game.gameOver) return;
            isProcessing = true;

            game.playCard(index, true);
            render();

            await sleep(500);
            await aiTurn();

            isProcessing = false;
        }

        async function takeCards() {
            if (isProcessing) return;
            isProcessing = true;

            game.endTurn(true);
            render();

            await sleep(500);
            if (!game.gameOver && game.attackerIsPlayer) {
                await aiTurn();
            }

            isProcessing = false;
        }

        async function finishAttack() {
            if (isProcessing) return;
            isProcessing = true;

            game.endTurn(false);
            render();

            await sleep(500);
            if (!game.gameOver && game.attackerIsPlayer) {
                await aiTurn();
            }

            isProcessing = false;
        }

        async function aiTurn() {
            document.getElementById('aiThinking').style.display = 'block';
            
            while (!game.gameOver) {
                await sleep(800);
                
                const move = game.aiMove();
                if (move === null) {
                    game.endTurn(true);
                    render();
                    break;
                }

                game.playCard(move, false);
                render();

                if (game.canFinish() && !game.attackerIsPlayer) {
                    await sleep(500);
                    game.endTurn(false);
                    render();
                    break;
                }

                if (game.attackerIsPlayer) {
                    break; // Ход игрока
                }
            }

            document.getElementById('aiThinking').style.display = 'none';
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Запуск
        startGame();
    </script>
</body>
</html>
