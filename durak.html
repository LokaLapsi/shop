<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дурак</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .game-info {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .trump {
            font-size: 32px;
            text-align: center;
            margin: 10px 0;
        }
        .table {
            background: #2d5016;
            border-radius: 15px;
            padding: 20px;
            min-height: 150px;
            margin-bottom: 20px;
        }
        .table-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .card-pair {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .card {
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
            min-width: 50px;
            text-align: center;
        }
        .card:hover:not(.disabled) {
            transform: translateY(-5px);
        }
        .card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .card.red {
            color: #d32f2f;
        }
        .card.black {
            color: #000;
        }
        .hand {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Загрузка игры...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let gameState = null;
        const API_URL = 'https://ваш-сервер.com'; // Замените на ваш сервер

        async function startGame() {
            try {
                const response = await fetch(`${API_URL}/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: tg.initDataUnsafe?.user?.id || 'test'
                    })
                });
                gameState = await response.json();
                renderGame();
            } catch (error) {
                document.getElementById('app').innerHTML = '<div class="status">Ошибка подключения к серверу</div>';
            }
        }

        async function makeMove(action, cardIndex = null) {
            try {
                const response = await fetch(`${API_URL}/move`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: tg.initDataUnsafe?.user?.id || 'test',
                        action: action,
                        card_index: cardIndex
                    })
                });
                gameState = await response.json();
                renderGame();
            } catch (error) {
                alert('Ошибка хода');
            }
        }

        function getCardColor(suit) {
            return (suit === '♥' || suit === '♦') ? 'red' : 'black';
        }

        function renderGame() {
            if (!gameState) return;

            const app = document.getElementById('app');
            
            let html = `
                <div class="game-info">
                    <div>Козырь: <span class="trump">${gameState.trump}</span></div>
                    <div>Карт в колоде: ${gameState.deck_count}</div>
                    <div>Карт у ИИ: ${gameState.ai_cards_count}</div>
                </div>

                <div class="status">${gameState.status}</div>

                <div class="table">
                    <div class="table-cards">
            `;

            if (gameState.table && gameState.table.length > 0) {
                gameState.table.forEach(pair => {
                    html += `<div class="card-pair">`;
                    html += `<div class="card ${getCardColor(pair.attack.suit)}">${pair.attack.rank}${pair.attack.suit}</div>`;
                    if (pair.defense) {
                        html += `<div>←</div>`;
                        html += `<div class="card ${getCardColor(pair.defense.suit)}">${pair.defense.rank}${pair.defense.suit}</div>`;
                    } else {
                        html += `<div class="card disabled">?</div>`;
                    }
                    html += `</div>`;
                });
            } else {
                html += '<div style="color: rgba(255,255,255,0.5); text-align: center;">Стол пуст</div>';
            }

            html += `</div></div>`;

            if (gameState.game_over) {
                html += `<div class="status">${gameState.winner}</div>`;
                html += `<button class="btn" onclick="startGame()">Новая игра</button>`;
            } else {
                // Кнопки действий
                html += '<div style="text-align: center; margin: 15px 0;">';
                if (gameState.can_take) {
                    html += '<button class="btn" onclick="makeMove(\'take\')">🛑 Беру</button>';
                }
                if (gameState.can_finish) {
                    html += '<button class="btn" onclick="makeMove(\'finish\')">✅ Бито</button>';
                }
                html += '</div>';

                // Карты игрока
                html += '<div class="hand">';
                gameState.player_hand.forEach((card, index) => {
                    const disabled = !gameState.valid_cards.includes(index) ? 'disabled' : '';
                    html += `
                        <div class="card ${getCardColor(card.suit)} ${disabled}" 
                             onclick="${disabled ? '' : `makeMove('play', ${index})`}">
                            ${card.rank}${card.suit}
                        </div>
                    `;
                });
                html += '</div>';
            }

            app.innerHTML = html;
        }

        // Запуск игры при загрузке
        startGame();
    </script>
</body>
</html>
